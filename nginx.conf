load_module modules/ngx_otel_module.so;

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/nginx/proxy_temp;
    client_body_temp_path /tmp/nginx/client_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"trace_id":"$otel_trace_id",'
        '"span_id":"$otel_span_id",'
        '"parent_sampled":"$otel_parent_sampled"}';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    otel_exporter {
        endpoint alloy.monitoring.svc.cluster.local:4317;
        interval 5s;
        batch_size 512;
        batch_count 4;
    }

    otel_service_name bakseter-no;

    otel_resource_attr service.namespace bakseter-no;
    otel_resource_attr deployment.environment.name production;
    otel_resource_attr k8s.cluster.name homelab;

    server {
        listen       8080;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Behind a gateway: don't put :8080 in Location headers
        absolute_redirect off;

        otel_trace $otel_parent_sampled;
        otel_trace_context propagate;

        otel_span_name "$request_method $uri";

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        location = /status {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Never serve dotfiles
        location ~ /\. {
            return 404;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }

        # CSS filename isn't hashed, so keep caching short
        location /css/ {
            expires 1h;
            try_files $uri =404;
        }

        # No logs/traces for static assets
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
            otel_trace off;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
